<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>خطای اتصال</title>
    <style>
      * { box-sizing: border-box; }
      html, body { min-height: 100%; margin: 0; }
      body { display: grid; place-items: center; padding: 2rem; background: #f8fafc; color: #4a4a4a; font-family: Tahoma, Arial, sans-serif; }
      main { max-width: 32rem; text-align: center; }
      h1 { color: #1f2937; }
      p { line-height: 1.9; }
      button { margin-top: 1rem; border: 0; border-radius: .8rem; padding: .8rem 1.5rem; background: #f4c232; color: #292524; font: inherit; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <h1>اتصال برقرار نشد</h1>
      <p>اینترنت دستگاه یا دسترسی به سرور کارخودرو را بررسی کنید و دوباره تلاش کنید.</p>
      <button type="button" onclick="location.reload()">تلاش دوباره</button>
    </main>
  </body>
</html>
