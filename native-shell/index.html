<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <title>کارخودرو</title>
    <style>
      * { box-sizing: border-box; }
      html, body { min-height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
        background: #f8fafc;
        color: #4a4a4a;
        font-family: Tahoma, Arial, sans-serif;
      }
      main { max-width: 34rem; padding: 2rem; border: 1px solid #e5e7eb; border-radius: 1rem; background: white; text-align: center; box-shadow: 0 12px 35px rgb(0 0 0 / .08); }
      h1 { margin: 0 0 1rem; color: #1f2937; }
      p { margin: .5rem 0; line-height: 1.9; }
      code { direction: ltr; unicode-bidi: embed; }
    </style>
  </head>
  <body>
    <main>
      <h1>تنظیمات برنامه کامل نیست</h1>
      <p>پیش از همگام‌سازی نسخه موبایل، آدرس HTTPS وب‌سایت را در <code>CAPACITOR_SERVER_URL</code> تنظیم کنید.</p>
    </main>
  </body>
</html>
